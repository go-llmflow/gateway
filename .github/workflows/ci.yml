name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test (race) ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    services:
      # A throw-away database with trust authentication: no password
      # exists, so none can leak from the workflow.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: llmflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CGO_ENABLED: '1'
      LLMFLOW_TEST_PG_DSN: postgres://postgres@127.0.0.1:5432/llmflow?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: benchmarks run (not measured)
        run: go test -run '^$' -bench '^BenchmarkAdmission$' -benchtime=1x ./gateway

  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzCompute, pkg: ./lending }
          - { target: FuzzRewrite, pkg: ./openai }
          - { target: FuzzCopySSE, pkg: ./openai }
          - { target: FuzzParse, pkg: ./config }
          - { target: FuzzRef, pkg: ./secret }
          - { target: FuzzParseKV2, pkg: ./secret }
          - { target: FuzzClientAddr, pkg: ./gateway }
          - { target: FuzzAnthropicHeaders, pkg: ./gateway }
          - { target: FuzzJWTBearer, pkg: ./gateway }
          - { target: FuzzSSOCallback, pkg: ./gateway }
          - { target: FuzzSCIM, pkg: ./gateway }
          - { target: FuzzRequiredFields, pkg: ./gateway }
          - { target: FuzzParseCheckpoint, pkg: ./audit }
          - { target: FuzzValidKey, pkg: ./export }
          - { target: FuzzHoldback, pkg: ./guard }
          - { target: FuzzStreamFilter, pkg: ./guard }
          - { target: FuzzMapRequest, pkg: ./guard }
          - { target: FuzzParseGuardAnswers, pkg: ./guard }
          - { target: FuzzMapResponse, pkg: ./guard }
          - { target: FuzzRewriteResponses, pkg: ./openai }
          - { target: FuzzScopeEveryRoute, pkg: ./openai }
          - { target: FuzzRead, pkg: ./spool }
          - { target: FuzzProjectHeader, pkg: ./gateway }
          - { target: FuzzReportsQuery, pkg: ./gateway }
          - { target: FuzzCostCenter, pkg: ./config }
          - { target: FuzzExportWriters, pkg: ./gateway }
          - { target: FuzzSreport, pkg: ./slurm }
          - { target: FuzzMessagesStream, pkg: ./openai }
          - { target: FuzzAnthropicStreamFilter, pkg: ./guard }
          - { target: FuzzReadAudioForm, pkg: ./gateway }
          - { target: FuzzTranscriptionRewrite, pkg: ./openai }
          - { target: FuzzEscapedFindings, pkg: ./guard }
          - { target: FuzzUIForms, pkg: ./gateway }
          - { target: FuzzMCPEndpoint, pkg: ./gateway }
          - { target: FuzzParseMessage, pkg: ./mcp }
          - { target: FuzzHeaderValue, pkg: ./mcp }
          - { target: FuzzHeaderParams, pkg: ./mcp }
          - { target: FuzzReadResponse, pkg: ./mcp }
          - { target: FuzzInternalAPI, pkg: ./ha }
          - { target: FuzzShapeOf, pkg: ./openai }
          - { target: FuzzWorstCase, pkg: ./gateway }
          - { target: FuzzProfileHCL, pkg: ./config }
          - { target: FuzzProfileAPI, pkg: ./gateway }
          - { target: FuzzProfileForms, pkg: ./gateway }
          - { target: FuzzParseText, pkg: ./energy }
          - { target: FuzzReconcileEnergy, pkg: ./gateway }
          - { target: FuzzParseSacct, pkg: ./energy }
          - { target: FuzzParseFluids, pkg: ./config }
          - { target: FuzzParse, pkg: ./internal/warnat }
          - { target: FuzzSoftQuotas, pkg: ./config }
          - { target: FuzzRender, pkg: ./cmd/llmflow-status }
          - { target: FuzzBuildQuotas, pkg: ./gateway }
          - { target: FuzzBuildVariance, pkg: ./gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: fuzz
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ${{ matrix.pkg }}

  build:
    name: cross-build CGO_ENABLED=0 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o llmflow-gateway ./cmd/llmflow-gateway
          go build -trimpath -o llmflow-status ./cmd/llmflow-status

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
