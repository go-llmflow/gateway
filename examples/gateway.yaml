# llmflow-gateway configuration for a 4-node HGX B300 cluster (32 GPUs)
# shared by two institutions. Secrets are never in this file: each *_file
# key names a file holding one secret on one line (mode 0600).

listen: 0.0.0.0:8080
master_key_file: /etc/llmflow/master.key        # admin API bearer token
metrics_token_file: /etc/llmflow/metrics.token  # optional bearer token on /metrics

store:
  kind: postgres                  # or memory (state lost on restart)
  dsn_file: /etc/llmflow/pg.dsn   # e.g. postgres://llmflow@db:5432/llmflow?sslmode=verify-full
  fail_closed: true               # 503 when budget state cannot be refreshed
  queue_size: 10000               # bounded accounting queue
  batch_size: 256

limits:
  max_body_bytes: 8388608
  max_header_bytes: 65536
  read_header_timeout: 10s
  read_timeout: 60s
  idle_timeout: 120s
  upstream_header_timeout: 10m
  max_request_duration: 30m
  max_response_bytes: 67108864

fairshare:
  half_life: 168h                 # usage decay, Slurm's default PriorityDecayHalfLife (7 days)

health:
  interval: 5s
  timeout: 2s
  cooldown: 30s
  path: /health

retries: 2
budget_refresh: 10s
key_cache_ttl: 30s
expose_overhead_header: false

teams:
  - {name: etabA, share: 0.8125}  # 26 of 32 GPUs
  - {name: etabB, share: 0.1875}  #  6 of 32 GPUs

pools:
  # C: sustainable concurrency of the pool, measured externally (the number
  # of concurrent requests vLLM keeps running without preempting).
  - {name: b300, capacity: 256}

model_groups:
  - name: llama-3.3-70b
    upstream_model: meta-llama/Llama-3.3-70B-Instruct
    pool: b300
    class: interactive
    upstreams:
      - http://10.0.0.11:8000
      - http://10.0.0.12:8000
      - http://10.0.0.13:8000
      - http://10.0.0.14:8000
    api_key_file: /etc/llmflow/vllm.key
    cost:                         # GPU-hours per million tokens (internal price)
      input_per_mtok: 0.02
      output_per_mtok: 0.20
      cached_per_mtok: 0.002
  - name: llama-3.3-70b-batch
    upstream_model: meta-llama/Llama-3.3-70B-Instruct
    pool: b300
    class: batch
    upstreams:
      - http://10.0.0.11:8000
      - http://10.0.0.12:8000
      - http://10.0.0.13:8000
      - http://10.0.0.14:8000
    api_key_file: /etc/llmflow/vllm.key
    cost: {input_per_mtok: 0.02, output_per_mtok: 0.20, cached_per_mtok: 0.002}
